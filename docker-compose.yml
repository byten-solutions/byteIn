services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: byteinn-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://byteinn_user:byteinn_password@db:5432/byteinn?schema=public
      - SESSION_SECRET=byteinn-docker-compose-session-secret-min-32-chars-long
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: byteinn-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: byteinn_user
      POSTGRES_PASSWORD: byteinn_password
      POSTGRES_DB: byteinn
    volumes:
      - byteinn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byteinn_user -d byteinn"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  byteinn_pgdata:
    driver: local
